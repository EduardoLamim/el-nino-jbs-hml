name: Atualizar estado operacional e preparar Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no ambiente github-pages (não equivale a homologação)
        type: boolean
        default: false
permissions:
  contents: read
# Serializa coleta, persistência e deploy sem interromper execução ativa.
concurrency:
  group: operational-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - name: Ler ponta atual da branch padrão, inclusive em reexecuções antigas
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar snapshot anterior e datasets locais
        run: npm run data:validate
      - name: Coletar, aplicar motor existente e validar saída atômica
        id: collect
        run: npm run automation:update
      - name: Validar aplicação
        run: |
          npm run lint
          npm test
      - name: Build Pages com apenas as duas variáveis públicas
        run: npm run pages:build
        env:
          REQUIRE_PUBLIC_CONFIG: 'true'
          APP_ENV: ${{ github.repository == 'EduardoLamim/el-nino-jbs-hml' && 'hml' || 'production' }}
          ENABLE_HML_SIMULATION: 'true'
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Conferir conteúdo e integridade do artefato
        run: npm run pages:validate
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
      - name: Persistir somente o snapshot validado para o próximo ciclo
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualizar snapshot operacional validado'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
        # Push fast-forward: disputa aborta; nunca force ou rebase do snapshot.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 7
  deploy:
    needs: prepare
    if: inputs.publish == true || vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  source-diagnostics:
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.degraded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Sinalizar falha de fonte sem ocultar snapshot degradado válido
        run: |
          echo '::error::Houve falha de fonte. Consulte a coleta; snapshot degradado validado foi preparado. Verifique separadamente o resultado do deploy.'
          exit 1

