name: Reconciliar notificacoes Teams HML
on:
  workflow_run:
    workflows: [Atualizar estado operacional e preparar Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: teams-notifications-hml
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'EduardoLamim/el-nino-jbs-hml' &&
      vars.TEAMS_HML_ENABLED == 'true' &&
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository ||
       github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reconciliar snapshots e historico privado; drenar somente testes autorizados
        run: npx tsx scripts/teams/reconcile.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAMS_WAKE_TOKEN_HML: ${{ secrets.TEAMS_WAKE_TOKEN_HML }}
